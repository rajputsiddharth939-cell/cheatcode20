name: Import CHEATCODE Product Images

on:
  push:
    paths-ignore:
      - "public/images/**"
      - ".github/workflows/import-product-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source images
        run: |
          mkdir -p /tmp/cheatcode-images
          curl -L --fail "https://drive.google.com/thumbnail?id=1GSfwVcGnnE-_XqJH0D9ey8Ynyy1YRygr&sz=w1200" -o /tmp/cheatcode-images/belgian-chocolate.png
          curl -L --fail "https://drive.google.com/thumbnail?id=1tmjINAUp4aaQeSci0tupgGmbgg5DvCLq&sz=w1200" -o /tmp/cheatcode-images/vanilla-crunch.png
          curl -L --fail "https://drive.google.com/thumbnail?id=1yN6HhOtX152LJKfnIbyVPZU0lG9LGx9-&sz=w1200" -o /tmp/cheatcode-images/midnight-cookies.png
          curl -L --fail "https://drive.google.com/thumbnail?id=1Lw7Ua2opBLNKHeAjirc9EQFeFEvmabmY&sz=w1200" -o /tmp/cheatcode-images/blueberry-cheesecake.png
          curl -L --fail "https://drive.google.com/thumbnail?id=1CG5JNwyj7Q8yMA4wzs2Prg4ga1MovSPF&sz=w1200" -o /tmp/cheatcode-images/guava-chilli.png

      - name: Convert to optimized WebP
        run: |
          python -m pip install --upgrade pip pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path("/tmp/cheatcode-images")
          dst = Path("public/images")
          dst.mkdir(parents=True, exist_ok=True)
          for p in src.glob("*.png"):
              image = Image.open(p).convert("RGBA")
              image.thumbnail((800, 800), Image.Resampling.LANCZOS)
              image.save(dst / (p.stem + ".webp"), "WEBP", quality=82, method=6)
          PY

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          git commit -m "Add optimized CHEATCODE product images" || exit 0
          git push
